name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/sitehaus/sitehaus-commerce

jobs:
  # ── Stage 1: Build & push staging images ──────────────────────────────────
  build-staging:
    name: Build ${{ matrix.app }} (staging)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: gateway
            dockerfile: apps/gateway/Dockerfile
          - app: commerce
            dockerfile: apps/commerce/Dockerfile
          - app: payments
            dockerfile: apps/payments/Dockerfile
          - app: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:staging
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:staging-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}-staging
          cache-to: type=gha,scope=${{ matrix.app }}-staging,mode=max

  # ── Stage 2: Deploy to staging ────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: build-staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@master
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VULTR_STAGING_IP }}
          username: deploy
          key: ${{ secrets.VULTR_SSH_KEY }}
          envs: GHCR_TOKEN,GH_ACTOR
          script: |
            set -euo pipefail
            cd /srv/sitehaus-commerce
            # Log in to GHCR every deploy so image pulls never depend on a hand-set
            # server login that silently expires (the prior one lapsed 2026-07).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            git fetch origin main
            git reset --hard origin/main
            export IMAGE_TAG=staging
            docker compose -f docker-compose.prod.yml pull
            # Migrate before app boot — same reason as the sitehaus repo's CD.
            docker compose -f docker-compose.prod.yml up -d postgres
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate
            docker image prune -f

  # ── Stage 3: Manual approval gate ─────────────────────────────────────────
  await-approval:
    name: Awaiting approval to promote to production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: staging # ← configure required reviewers here in GitHub
    steps:
      - run: echo "Approved — promoting to production"

  # ── Stage 4: Build & push production images ───────────────────────────────
  build-production:
    name: Build ${{ matrix.app }} (production)
    needs: await-approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: gateway
            dockerfile: apps/gateway/Dockerfile
          - app: commerce
            dockerfile: apps/commerce/Dockerfile
          - app: payments
            dockerfile: apps/payments/Dockerfile
          - app: worker
            dockerfile: apps/worker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  # ── Stage 5: Deploy to production ─────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    needs: build-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@master
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VULTR_IP }}
          username: deploy
          key: ${{ secrets.VULTR_SSH_KEY }}
          envs: GHCR_TOKEN,GH_ACTOR
          script: |
            set -euo pipefail
            cd /srv/sitehaus-commerce
            # Log in to GHCR every deploy so image pulls never depend on a hand-set
            # server login that silently expires (the prior one lapsed 2026-07).
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            git pull origin main
            docker compose -f docker-compose.prod.yml pull
            # Migrate before app boot — same reason as the sitehaus repo's CD.
            docker compose -f docker-compose.prod.yml up -d postgres
            docker compose -f docker-compose.prod.yml run --rm migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans --force-recreate
            docker image prune -f
