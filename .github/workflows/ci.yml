name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "docker-compose*.yml" # ← no need to run CI for compose changes
      - "infra/**" # ← or infra config changes
      - ".github/workflows/cd.yml"
  push:
    branches: [ci/staging]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "docker-compose*.yml"
      - "infra/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      # Mirrors docker-compose.dev.yml's db so the real-Postgres integration
      # suites (variations sync, address redaction) run against localhost:5433.
      db:
        image: postgres:17
        env:
          POSTGRES_USER: ecom
          POSTGRES_PASSWORD: ecom
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ecom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Type check and Build
        run: pnpm turbo run check-types build --cache-dir=.turbo
