# pg_hba.conf — restrict connections to Docker network only
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Allow local unix socket connections (needed for pg_isready healthcheck)
local   all             all                                     trust

# Allow connections from within the Docker bridge network only (172.16.0.0/12 covers all Docker subnets)
host    all             all             172.16.0.0/12           scram-sha-256

# Allow connections from standard Docker bridge (172.17.0.0/16)
host    all             all             172.17.0.0/16           scram-sha-256

# Deny everything else
# (implicit — no catch-all rule means all other connections are rejected)