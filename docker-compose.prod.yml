services:
  postgres:
    image: postgres:17-alpine
    restart: always
    networks:
      - sitehaus-commerce-network
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - sitehaus-commerce-network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  # One-shot Drizzle migration runner. Not part of `up` (profile-gated) — CD runs
  # `docker compose run --rm migrate` after postgres is healthy and before the
  # apps start. Mirrors the working pattern in the sitehaus repo's compose files.
  migrate:
    profiles: ["migrate"]
    image: node:20-alpine
    restart: "no"
    working_dir: /repo/packages/database
    volumes:
      - ./:/repo
    env_file:
      - ./apps/commerce/.env
    networks:
      - sitehaus-commerce-network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - "corepack enable && corepack prepare pnpm@10.14.0 --activate && pnpm install --filter @sitehaus-ecom/database... --frozen-lockfile && pnpm --filter @sitehaus-ecom/database db:migrate"

  gateway:
    image: ghcr.io/sitehaus/sitehaus-commerce-gateway:${IMAGE_TAG:-latest}
    restart: always
    networks:
      - sitehaus-commerce-network
    env_file:
      - ./apps/gateway/.env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7020/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  commerce:
    image: ghcr.io/sitehaus/sitehaus-commerce-commerce:${IMAGE_TAG:-latest}
    restart: always
    networks:
      - sitehaus-commerce-network
    env_file:
      - ./apps/commerce/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  payments:
    image: ghcr.io/sitehaus/sitehaus-commerce-payments:${IMAGE_TAG:-latest}
    restart: always
    networks:
      - sitehaus-commerce-network
    env_file:
      - ./apps/payments/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  worker:
    image: ghcr.io/sitehaus/sitehaus-commerce-worker:${IMAGE_TAG:-latest}
    restart: always
    networks:
      - sitehaus-commerce-network
    env_file:
      - ./apps/worker/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sitehaus-commerce-network
    env_file:
      - .env
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  sitehaus-commerce-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
